<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MySales – Quản lý bán hàng cá nhân</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#718096;--line:#e7ebf2;--green:#16845b;--green2:#e7f6ef;--red:#c94b4b;--amber:#a66b12;--blue:#4263a5;--shadow:0 8px 28px #24334d0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:650}button.secondary{background:#eef2f7;color:#344054}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#122b25;color:#e9f5ef;padding:24px 16px}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;margin:2px 10px 6px}.subbrand{color:#a9c8ba;font-size:12px;margin:0 10px 28px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#c5d9d0;text-align:left;font-weight:550}.nav button.active,.nav button:hover{background:#21483c;color:white}.side-note{font-size:11px;color:#a9c8ba;margin:30px 10px}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.top h1{font-size:24px;margin:0;letter-spacing:-.5px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:25px;font-weight:800;margin:7px 0 2px;letter-spacing:-.7px}.metric-note{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.panel h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:230px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:650;color:#526071}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px 11px;border:1px solid #dce2ea;border-radius:9px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#58a98a;box-shadow:0 0 0 3px #16845b16}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:650;background:#fafbfd}td strong{font-size:13px}.positive{color:var(--green);font-weight:750}.negative{color:var(--red);font-weight:700}.tag{display:inline-block;border-radius:30px;padding:4px 8px;background:var(--green2);color:var(--green);font-size:11px}.tag.warn{background:#fff5df;color:var(--amber)}.empty{text-align:center;color:var(--muted);padding:30px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#10231f88;display:grid;place-items:center;padding:15px;z-index:5}.dialog{background:white;border-radius:16px;padding:20px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialoghead h2{margin:0;font-size:19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.lineitem{display:grid;grid-template-columns:2fr .7fr 1fr 36px;gap:7px;align-items:end;margin-bottom:8px}.lineitem input,.lineitem select{min-width:0;width:100%;padding:9px;border:1px solid #dce2ea;border-radius:8px}.summaryline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}.bars{display:flex;align-items:end;gap:9px;height:150px;padding-top:12px}.barcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px;height:100%;font-size:10px;color:var(--muted)}.bar{width:min(35px,75%);background:#54a987;border-radius:6px 6px 2px 2px;min-height:3px}.barval{font-size:10px;color:#344054}.customerbox{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.notice{background:#f0f7f3;border:1px solid #d9eee2;border-radius:10px;padding:11px;color:#37634f;font-size:12px;margin-bottom:14px}.mobiletop{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:12px 14px;position:sticky;top:0;z-index:3}.brand{display:inline-block;margin:0 12px 0 0}.subbrand{display:none}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.side-note{display:none}.main{padding:18px 13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{font-size:21px}.grid2{grid-template-columns:1fr}.top h1{font-size:21px}.top{align-items:flex-start}.lineitem{grid-template-columns:1.4fr .6fr 1fr 32px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media(max-width:420px){.metric{font-size:18px}.card{padding:12px}.top{flex-direction:column}.top button{width:100%}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">✳ MySales</div><div class="subbrand">QUẢN LÝ BÁN HÀNG CÁ NHÂN</div><nav class="nav">
<button class="active" data-page="dashboard">▦ Tổng quan</button><button data-page="orders">▤ Đơn hàng</button><button data-page="customers">♙ Khách hàng</button><button data-page="products">▣ Sản phẩm</button><button data-page="expenses">＋ Chi phí</button><button data-page="reports">▥ Báo cáo</button><button data-page="settings">⚙ Dữ liệu</button>
</nav><div class="side-note">MySales · Có thể đồng bộ qua Supabase</div></aside>
<main class="main"><div class="top"><div><div class="muted" id="today"></div><h1 id="pageTitle">Tổng quan</h1></div><button id="quickAdd">＋ Tạo đơn hàng</button></div><div id="page"></div></main></div>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="secondary small" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='mysales_v1';let db=load();let page='dashboard';let orderLines=[];let cloud=null,cloudUser=null,cloudBusy=false,cloudChannel=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{orders:[],customers:[],products:[],expenses:[]}}catch{return{orders:[],customers:[],products:[],expenses:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();cloudPush()}
const money=n=>(Number(n)||0).toLocaleString('vi-VN')+' ₫';const num=v=>Number(v)||0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const dateFmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('vi-VN'):'—';
function customer(id){return db.customers.find(x=>x.id===id)}function product(id){return db.products.find(x=>x.id===id)}function orderProfit(o){return o.lines.reduce((s,l)=>s+(num(l.price)-num(l.cost))*num(l.qty),0)-num(o.extraCost)-expensesTotal(db.expenses.filter(e=>e.orderId===o.id))}function revenue(o){return o.lines.reduce((s,l)=>s+num(l.price)*num(l.qty),0)}function cost(o){return o.lines.reduce((s,l)=>s+num(l.cost)*num(l.qty),0)}function expensesTotal(list){return list.reduce((s,x)=>s+num(x.amount),0)}
function inRange(d,from,to){return d>=from&&d<=to}function weekStart(d){let x=new Date(d+'T00:00:00');let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}
function totals(orders,expenses){let r=orders.reduce((s,o)=>s+revenue(o),0),c=orders.reduce((s,o)=>s+cost(o),0),e=expensesTotal(expenses)+orders.reduce((s,o)=>s+num(o.extraCost),0);return{r,c,e,p:r-c-e,n:orders.length}}
function render(){document.getElementById('today').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('pageTitle').textContent=({dashboard:'Tổng quan',orders:'Đơn hàng',customers:'Khách hàng',products:'Sản phẩm',expenses:'Chi phí',reports:'Báo cáo',settings:'Dữ liệu'})[page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let el=document.getElementById('page');el.innerHTML=({dashboard:dashboardPage,orders:ordersPage,customers:customersPage,products:productsPage,expenses:expensesPage,reports:reportsPage,settings:settingsPage})[page]();}
function metric(label,value,note=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div><div class="metric-note">${note}</div></div>`}
function dashboardPage(){let now=today(),month=now.slice(0,7),ws=weekStart(now);let mo=db.orders.filter(o=>o.date.startsWith(month)),we=db.orders.filter(o=>inRange(o.date,ws,now));let mt=totals(mo,db.expenses.filter(e=>e.date.startsWith(month))),wt=totals(we,db.expenses.filter(e=>inRange(e.date,ws,now)));let recent=[...db.orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);let overdue=db.customers.map(c=>({...c,last:db.orders.filter(o=>o.customerId===c.id).map(o=>o.date).sort().at(-1)})).filter(c=>c.last&&Math.floor((Date.now()-new Date(c.last+'T00:00:00'))/86400000)>=30);
return `<div class="notice">Lưu ý: doanh thu và lợi nhuận được tính từ đơn hàng đã ghi nhận. Chi phí chung được trừ theo kỳ báo cáo.</div><div class="cards">${metric('Doanh thu tháng',money(mt.r),month)}${metric('Lợi nhuận tháng',`<span class="${mt.p<0?'negative':'positive'}">${money(mt.p)}</span>`,`${mo.length} đơn hàng`)}${metric('Doanh thu tuần',money(wt.r),`Từ ${dateFmt(ws)}`)}${metric('Lợi nhuận tuần',`<span class="${wt.p<0?'negative':'positive'}">${money(wt.p)}</span>`,`${we.length} đơn hàng`)}</div><div class="grid2"><section class="panel"><h2>Đơn hàng gần đây</h2>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Khách hàng</th><th>Doanh thu</th><th>Lợi nhuận</th></tr></thead><tbody>${recent.map(o=>`<tr><td>${dateFmt(o.date)}</td><td>${esc(customer(o.customerId)?.name||'Khách lẻ')}</td><td>${money(revenue(o))}</td><td class="${orderProfit(o)<0?'negative':'positive'}">${money(orderProfit(o))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có đơn hàng. Hãy tạo đơn đầu tiên.</div>'}</section><section class="panel"><h2>Khách hàng cần chăm sóc</h2>${overdue.length?overdue.map(c=>`<div class="customerbox"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.area||c.address||'Chưa có địa chỉ')}</div></div><span class="tag warn">${Math.floor((Date.now()-new Date(c.last+'T00:00:00'))/86400000)} ngày</span></div>`).join(''):'<div class="empty">Chưa có khách nào quá 30 ngày chưa mua.</div>'}</section></div>`}
function ordersPage(){let rows=[...db.orders].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="toolbar"><input id="orderSearch" placeholder="Tìm khách hàng, mã đơn..."><button onclick="openOrder()">＋ Thêm đơn hàng</button></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Doanh thu</th><th>Giá vốn</th><th>Lợi nhuận</th><th></th></tr></thead><tbody id="orderRows">${rows.map(orderRow).join('')||'<tr><td colspan="8" class="empty">Chưa có đơn hàng</td></tr>'}</tbody></table></div></section>`}
function orderRow(o){return `<tr data-search="${esc((customer(o.customerId)?.name||'')+' '+o.id).toLowerCase()}"><td>${dateFmt(o.date)}</td><td>${esc(o.id)}</td><td>${esc(customer(o.customerId)?.name||'Khách lẻ')}</td><td>${o.lines.map(l=>esc(l.name)+' × '+l.qty).join(', ')}</td><td>${money(revenue(o))}</td><td>${money(cost(o))}</td><td class="${orderProfit(o)<0?'negative':'positive'}">${money(orderProfit(o))}</td><td><button class="small danger" onclick="del('orders','${o.id}')">Xóa</button></td></tr>`}
function customersPage(){let filt=window.customerFilter||'all';let rows=db.customers.map(c=>{let os=db.orders.filter(o=>o.customerId===c.id),last=os.map(o=>o.date).sort().at(-1),days=last?Math.floor((Date.now()-new Date(last+'T00:00:00'))/86400000):null;return{c,os,last,days}}).filter(x=>filt==='all'||(filt==='never'&&x.days===null)||(filt!=='never'&&x.days!==null&&x.days>=Number(filt))).sort((a,b)=>(b.days??-1)-(a.days??-1));return `<div class="toolbar"><input id="customerSearch" placeholder="Tìm tên, số điện thoại, khu vực..."><button onclick="openCustomer()">＋ Thêm khách hàng</button></div><div class="toolbar"><button class="${filt==='all'?'':'secondary'} small" onclick="setCustomerFilter('all')">Tất cả</button><button class="${filt==='15'?'':'secondary'} small" onclick="setCustomerFilter('15')">≥ 15 ngày</button><button class="${filt==='30'?'':'secondary'} small" onclick="setCustomerFilter('30')">≥ 30 ngày</button><button class="${filt==='60'?'':'secondary'} small" onclick="setCustomerFilter('60')">≥ 60 ngày</button><button class="${filt==='never'?'':'secondary'} small" onclick="setCustomerFilter('never')">Chưa có đơn</button><span class="muted" style="font-size:12px">Hiển thị ${rows.length} khách</span></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Khách hàng</th><th>Liên hệ</th><th>Khu vực / địa chỉ</th><th>Số đơn</th><th>Tổng mua</th><th>Lần mua gần nhất</th><th>Chưa nhập hàng</th><th></th></tr></thead><tbody id="customerRows">${rows.map(({c,os,last,days})=>`<tr data-search="${esc((c.name+' '+c.phone+' '+c.area+' '+c.address).toLowerCase())}"><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${esc([c.area,c.address].filter(Boolean).join(' · ')||'—')}</td><td>${os.length}</td><td>${money(os.reduce((s,o)=>s+revenue(o),0))}</td><td>${dateFmt(last)}</td><td>${days===null?'<span class="tag warn">Chưa có đơn</span>':days>=60?`<span class="tag warn">${days} ngày</span>`:days>=30?`<span class="tag warn">${days} ngày</span>`:`${days} ngày`}</td><td><button class="small danger" onclick="del('customers','${c.id}')">Xóa</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Không có khách hàng trong nhóm này</td></tr>'}</tbody></table></div></section>`}
function setCustomerFilter(v){window.customerFilter=v;render()}
function productsPage(){return `<div class="notice">Giá vốn được lưu trên từng sản phẩm. Khi tạo đơn, giá vốn hiện tại sẽ được chụp vào đơn hàng; cập nhật giá sản phẩm sau này không làm thay đổi lãi của đơn cũ. Bạn có thể dùng cùng một nhà cung cấp cho toàn bộ danh mục.</div><div class="toolbar"><button onclick="openProduct()">＋ Thêm sản phẩm</button></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Sản phẩm</th><th>Giá vốn</th><th>Giá bán mặc định</th><th>Lãi dự kiến</th><th>Ghi chú</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="positive">${money(num(p.price)-num(p.cost))}</td><td>${esc(p.note||'—')}</td><td><button class="small danger" onclick="del('products','${p.id}')">Xóa</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có sản phẩm</td></tr>'}</tbody></table></div></section>`}
function expensesPage(){return `<div class="toolbar"><button onclick="openExpense()">＋ Ghi chi phí</button></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Khoản chi</th><th>Nhóm</th><th>Gắn với đơn</th><th>Số tiền</th><th>Ghi chú</th><th></th></tr></thead><tbody>${[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${dateFmt(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.category)}</td><td>${esc(e.orderId||'Chi phí chung')}</td><td>${money(e.amount)}</td><td>${esc(e.note||'—')}</td><td><button class="small danger" onclick="del('expenses','${e.id}')">Xóa</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Chưa có chi phí</td></tr>'}</tbody></table></div></section>`}
function reportsPage(){let month=today().slice(0,7),orders=db.orders.filter(o=>o.date.startsWith(month)),ex=db.expenses.filter(e=>e.date.startsWith(month)),t=totals(orders,ex);let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);let k=d.toISOString().slice(0,7),os=db.orders.filter(o=>o.date.startsWith(k)),es=db.expenses.filter(e=>e.date.startsWith(k));return{k,...totals(os,es)}});let max=Math.max(1,...months.map(m=>m.r));return `<div class="cards">${metric('Doanh thu tháng',money(t.r),month)}${metric('Giá vốn',money(t.c))}${metric('Tổng chi phí',money(t.e))}${metric('Lợi nhuận ròng',`<span class="${t.p<0?'negative':'positive'}">${money(t.p)}</span>`,`${t.n} đơn`)}</div><section class="panel"><h2>Doanh thu 6 tháng gần nhất</h2><div class="bars">${months.map(m=>`<div class="barcol"><div class="barval">${m.r?Math.round(m.r/1000)+'k':'0'}</div><div class="bar" style="height:${Math.max(2,m.r/max*100)}%"></div><span>${m.k.slice(5)}</span></div>`).join('')}</div></section><section class="panel" style="margin-top:15px"><h2>Báo cáo theo tháng</h2><div class="tablewrap"><table><thead><tr><th>Tháng</th><th>Số đơn</th><th>Doanh thu</th><th>Giá vốn</th><th>Chi phí</th><th>Lợi nhuận</th></tr></thead><tbody>${months.slice().reverse().map(m=>`<tr><td>${m.k}</td><td>${m.n}</td><td>${money(m.r)}</td><td>${money(m.c)}</td><td>${money(m.e)}</td><td class="${m.p<0?'negative':'positive'}">${money(m.p)}</td></tr>`).join('')}</tbody></table></div></section><p class="muted" style="font-size:12px">Báo cáo tuần và tháng được tính theo ngày ghi trên đơn/chi phí. Chi phí riêng của đơn đã được trừ trong lợi nhuận đơn; chi phí chung được phân bổ theo kỳ.</p>`}
function settingsPage(){let cfg=JSON.parse(localStorage.getItem('mysales_supabase_config')||'{}');return `<section class="panel"><h2>Đồng bộ điện thoại và máy tính</h2><div class="notice">${cloudUser?`Đã đăng nhập: ${esc(cloudUser.email)} · Đồng bộ đám mây đang bật.`:'Kết nối Supabase một lần để dùng chung dữ liệu trên nhiều thiết bị. Mỗi thiết bị cần nhập cùng Project URL và publishable key, sau đó đăng nhập cùng tài khoản.'}</div><div class="formgrid"><div class="field span2"><label>Supabase Project URL</label><input id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(cfg.url||'')}"></div><div class="field span2"><label>Supabase publishable key (hoặc anon key cũ)</label><input id="sbKey" placeholder="sb_publishable_... hoặc anon key" value="${esc(cfg.key||'')}"></div><div class="field"><label>Email</label><input id="sbEmail" type="email" placeholder="email của bạn"></div><div class="field"><label>Mật khẩu</label><input id="sbPass" type="password" placeholder="Mật khẩu tài khoản"></div></div><div class="toolbar"><button onclick="connectCloud()">Lưu cấu hình / kết nối</button><button class="secondary" onclick="cloudSignUp()">Tạo tài khoản</button><button class="secondary" onclick="cloudSignIn()">Đăng nhập & đồng bộ</button><button class="secondary" onclick="cloudSignOut()">Đăng xuất</button></div><p class="muted" style="font-size:12px">Không gửi mật khẩu cho bất kỳ ai. Mật khẩu chỉ được gửi trực tiếp tới Supabase Auth. Dữ liệu cục bộ vẫn được giữ làm bản dự phòng.</p><h3>Thiết lập cơ sở dữ liệu (chỉ làm một lần)</h3><p class="muted">Trong Supabase → SQL Editor → New query, chạy đoạn SQL sau:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:12px;border-radius:9px;font-size:12px">create table if not exists public.mysales_data (
  id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.mysales_data enable row level security;
grant select, insert, update, delete on public.mysales_data to authenticated;
do $$ begin
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='mysales_data' and policyname='user owns own MySales data') then
    create policy "user owns own MySales data" on public.mysales_data for all to authenticated using (auth.uid() = id) with check (auth.uid() = id);
  end if;
end $$;
do $$ begin
  if not exists (select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='mysales_data') then
    alter publication supabase_realtime add table public.mysales_data;
  end if;
end $$;</pre><button class="secondary small" onclick="copySql()">Sao chép SQL</button><p class="muted" style="font-size:12px">Sau khi tạo bảng, nhập Project URL và publishable key ở trên. Tạo tài khoản hoặc đăng nhập. Trên điện thoại, mở cùng file/website, nhập cùng cấu hình và đăng nhập cùng email để nhận dữ liệu.</p></section><section class="panel" style="margin-top:15px"><h2>Sao lưu và khôi phục dữ liệu</h2><p class="muted">Nên xuất bản sao lưu định kỳ dù đã bật đồng bộ đám mây.</p><div class="toolbar"><button onclick="backup()">↓ Xuất bản sao lưu JSON</button><label class="secondary" style="padding:10px 14px;border-radius:10px;cursor:pointer"><input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="restore(event)">↑ Khôi phục từ JSON</label><button class="secondary" onclick="exportOrders()">Xuất đơn hàng CSV</button></div><div class="summaryline"><span>Đơn hàng</span><strong>${db.orders.length}</strong></div><div class="summaryline"><span>Khách hàng</span><strong>${db.customers.length}</strong></div><div class="summaryline"><span>Sản phẩm</span><strong>${db.products.length}</strong></div><div class="summaryline"><span>Khoản chi</span><strong>${db.expenses.length}</strong></div></section>`}
function openModal(title,html,after){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden');if(after)after()}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openCustomer(){openModal('Thêm khách hàng',`<div class="formgrid"><div class="field"><label>Tên khách hàng *</label><input id="cName" required></div><div class="field"><label>Số điện thoại</label><input id="cPhone"></div><div class="field"><label>Khu vực / tỉnh thành</label><input id="cArea" placeholder="Ví dụ: Từ Sơn, Bắc Ninh"></div><div class="field"><label>Địa chỉ chi tiết</label><input id="cAddress"></div><div class="field span2"><label>Ghi chú</label><textarea id="cNote" rows="2"></textarea></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveCustomer()">Lưu khách hàng</button></div>`)}
function saveCustomer(){let name=document.getElementById('cName').value.trim();if(!name)return alert('Vui lòng nhập tên khách hàng');db.customers.push({id:uid('KH'),name,phone:cPhone.value.trim(),area:cArea.value.trim(),address:cAddress.value.trim(),note:cNote.value.trim()});closeModal();save()}
function openProduct(){openModal('Thêm sản phẩm',`<div class="formgrid"><div class="field span2"><label>Tên sản phẩm *</label><input id="pName"></div><div class="field"><label>Giá vốn (đ)</label><input id="pCost" type="number" min="0"></div><div class="field"><label>Giá bán mặc định (đ)</label><input id="pPrice" type="number" min="0"></div><div class="field span2"><label>Ghi chú</label><input id="pNote"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveProduct()">Lưu sản phẩm</button></div>`)}
function saveProduct(){if(!pName.value.trim())return alert('Vui lòng nhập tên sản phẩm');db.products.push({id:uid('SP'),name:pName.value.trim(),cost:num(pCost.value),price:num(pPrice.value),note:pNote.value.trim()});closeModal();save()}
function openExpense(){openModal('Ghi nhận chi phí',`<div class="formgrid"><div class="field"><label>Ngày *</label><input id="eDate" type="date" value="${today()}"></div><div class="field"><label>Tên khoản chi *</label><input id="eName" placeholder="Vận chuyển, đóng gói..."></div><div class="field"><label>Nhóm chi phí</label><select id="eCat"><option>Vận chuyển</option><option>Đóng gói</option><option>Quảng cáo</option><option>Đi lại</option><option>Khác</option></select></div><div class="field"><label>Số tiền (đ) *</label><input id="eAmount" type="number" min="0"></div><div class="field"><label>Gắn với đơn hàng (không bắt buộc)</label><select id="eOrder"><option value="">Chi phí chung</option>${db.orders.map(o=>`<option value="${o.id}">${o.id} · ${esc(customer(o.customerId)?.name||'Khách lẻ')}</option>`).join('')}</select></div><div class="field"><label>Ghi chú</label><input id="eNote"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveExpense()">Lưu chi phí</button></div>`)}
function saveExpense(){if(!eName.value.trim()||num(eAmount.value)<=0)return alert('Nhập tên khoản chi và số tiền hợp lệ');let obj={id:uid('CP'),date:eDate.value||today(),name:eName.value.trim(),category:eCat.value,amount:num(eAmount.value),orderId:eOrder.value,note:eNote.value.trim()};db.expenses.push(obj);closeModal();save()}
function openOrder(){orderLines=[];openModal('Tạo đơn hàng',`<div class="formgrid"><div class="field"><label>Ngày bán *</label><input id="oDate" type="date" value="${today()}"></div><div class="field"><label>Khách hàng</label><select id="oCustomer"><option value="">Khách lẻ / chưa lưu</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field span2"><label>Ghi chú đơn hàng</label><input id="oNote"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><strong>Sản phẩm trong đơn</strong><button class="secondary small" onclick="addLine()">＋ Thêm dòng</button></div><div id="orderLines"></div><div class="field" style="max-width:230px;margin-top:12px"><label>Chi phí riêng của đơn (đ)</label><input id="oExtra" type="number" min="0" value="0" oninput="updateOrderSummary()"></div><div id="orderSummary"></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveOrder()">Lưu đơn hàng</button></div>`,()=>{addLine()})}
function addLine(){orderLines.push({productId:'',name:'',qty:1,price:0,cost:0});renderLines()}
function renderLines(){let box=document.getElementById('orderLines');if(!box)return;box.innerHTML=orderLines.map((l,i)=>`<div class="lineitem"><select onchange="lineProduct(${i},this.value)"><option value="">Chọn sản phẩm</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===l.productId?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="__custom">Nhập tên khác</option></select><input type="number" min="1" value="${l.qty}" title="Số lượng" onchange="orderLines[${i}].qty=Math.max(1,num(this.value));updateOrderSummary()"><input type="number" min="0" value="${l.price}" title="Giá bán" placeholder="Giá bán" onchange="orderLines[${i}].price=num(this.value);updateOrderSummary()"><button class="small danger" onclick="orderLines.splice(${i},1);renderLines()">×</button><div style="grid-column:1/4;display:flex;gap:7px"><input style="flex:1" value="${esc(l.name)}" placeholder="Tên sản phẩm" onchange="orderLines[${i}].name=this.value"><input style="width:42%" type="number" min="0" value="${l.cost}" placeholder="Giá vốn/đv" title="Giá vốn mỗi đơn vị" onchange="orderLines[${i}].cost=num(this.value);updateOrderSummary()"></div></div>`).join('');updateOrderSummary()}
function lineProduct(i,id){if(id==='__custom'){orderLines[i]={...orderLines[i],productId:'',name:'',price:0,cost:0}}else{let p=product(id);orderLines[i]={...orderLines[i],productId:id,name:p?.name||'',price:num(p?.price),cost:num(p?.cost)}}renderLines()}
function updateOrderSummary(){let rev=orderLines.reduce((s,l)=>s+l.qty*l.price,0),c=orderLines.reduce((s,l)=>s+l.qty*l.cost,0),extra=num(document.getElementById('oExtra')?.value);let x=document.getElementById('orderSummary');if(x)x.innerHTML=`<div class="summaryline"><span>Doanh thu</span><strong>${money(rev)}</strong></div><div class="summaryline"><span>Giá vốn</span><strong>${money(c)}</strong></div><div class="summaryline"><span>Chi phí riêng</span><strong>${money(extra)}</strong></div><div class="summaryline"><strong>Lợi nhuận dự kiến</strong><strong class="${rev-c-extra<0?'negative':'positive'}">${money(rev-c-extra)}</strong></div>`}
function saveOrder(){let lines=orderLines.filter(l=>l.name.trim()&&l.qty>0);if(!lines.length)return alert('Thêm ít nhất một sản phẩm có tên');let o={id:'DH-'+Date.now().toString().slice(-7),date:oDate.value||today(),customerId:oCustomer.value,lines:lines.map(l=>({...l})),extraCost:num(oExtra.value),note:oNote.value.trim()};db.orders.push(o);closeModal();save()}
function del(type,id){if(!confirm('Bạn chắc chắn muốn xóa mục này?'))return;if(type==='orders'){db.expenses=db.expenses.filter(e=>e.orderId!==id)}db[type]=db[type].filter(x=>x.id!==id);save()}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function backup(){download('mysales-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.orders||!d.customers||!d.products||!d.expenses)throw Error();if(confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?')){db=d;save();alert('Đã khôi phục dữ liệu')}}catch{alert('File sao lưu không hợp lệ')}};r.readAsText(f)}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportOrders(){let rows=[['Ngày','Mã đơn','Khách hàng','Sản phẩm','Doanh thu','Giá vốn','Chi phí riêng','Lợi nhuận'],...db.orders.map(o=>[o.date,o.id,customer(o.customerId)?.name||'Khách lẻ',o.lines.map(l=>`${l.name} x${l.qty}`).join('; '),revenue(o),cost(o),o.extraCost,orderProfit(o)])];download('mysales-don-hang.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')}
const CLOUD_SQL=`create table if not exists public.mysales_data (id uuid primary key references auth.users(id) on delete cascade, data jsonb not null default '{}'::jsonb, updated_at timestamptz not null default now()); alter table public.mysales_data enable row level security; grant select, insert, update, delete on public.mysales_data to authenticated; do $$ begin if not exists (select 1 from pg_policies where schemaname='public' and tablename='mysales_data' and policyname='user owns own MySales data') then create policy "user owns own MySales data" on public.mysales_data for all to authenticated using (auth.uid() = id) with check (auth.uid() = id); end if; end $$; do $$ begin if not exists (select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='mysales_data') then alter publication supabase_realtime add table public.mysales_data; end if; end $$;`;
function copySql(){navigator.clipboard?.writeText(CLOUD_SQL).then(()=>alert('Đã sao chép SQL')).catch(()=>alert(CLOUD_SQL))}
function connectCloud(){let url=document.getElementById('sbUrl').value.trim(),key=document.getElementById('sbKey').value.trim();if(!/^https:\/\//.test(url)||!key)return alert('Nhập Project URL và publishable key hợp lệ');localStorage.setItem('mysales_supabase_config',JSON.stringify({url,key}));cloud=supabase.createClient(url,key);alert('Đã lưu cấu hình Supabase. Tiếp theo hãy tạo tài khoản hoặc đăng nhập.');render()}
function ensureCloud(){if(cloud)return true;let cfg=JSON.parse(localStorage.getItem('mysales_supabase_config')||'{}');if(!cfg.url||!cfg.key||!window.supabase)return false;cloud=supabase.createClient(cfg.url,cfg.key);return true}
async function cloudSignUp(){if(!ensureCloud())return alert('Hãy nhập và lưu cấu hình Supabase trước');let email=document.getElementById('sbEmail').value.trim(),password=document.getElementById('sbPass').value;if(!email||password.length<6)return alert('Nhập email và mật khẩu tối thiểu 6 ký tự');let {data,error}=await cloud.auth.signUp({email,password});if(error)return alert('Không tạo được tài khoản: '+error.message);if(data.session){cloudUser=data.user;startCloudRealtime();await cloudPush();alert('Đã tạo tài khoản và đồng bộ dữ liệu.')}else alert('Đã gửi yêu cầu đăng ký. Nếu Supabase bật xác nhận email, hãy xác nhận email rồi đăng nhập.');render()}
async function cloudSignIn(){if(!ensureCloud())return alert('Hãy nhập và lưu cấu hình Supabase trước');let email=document.getElementById('sbEmail').value.trim(),password=document.getElementById('sbPass').value;if(!email||!password)return alert('Nhập email và mật khẩu');let {data,error}=await cloud.auth.signInWithPassword({email,password});if(error)return alert('Đăng nhập thất bại: '+error.message);cloudUser=data.user;startCloudRealtime();cloudBusy=true;let res=await cloud.from('mysales_data').select('data').eq('id',cloudUser.id).maybeSingle();cloudBusy=false;if(res.error)return alert('Đăng nhập được nhưng chưa đọc được dữ liệu: '+res.error.message+' · Kiểm tra bảng và RLS');if(res.data?.data){if(confirm('Tìm thấy dữ liệu trên đám mây. Tải dữ liệu này về và thay dữ liệu đang có trên thiết bị?')){db=res.data.data;localStorage.setItem(KEY,JSON.stringify(db));render();alert('Đã đồng bộ dữ liệu từ đám mây.')}}else{await cloudPush();alert('Tài khoản mới: đã tải dữ liệu trên thiết bị này lên đám mây.')}render()}
function startCloudRealtime(){if(!cloud||!cloudUser)return;if(cloudChannel)cloud.removeChannel(cloudChannel);cloudChannel=cloud.channel('mysales-live-'+cloudUser.id).on('postgres_changes',{event:'*',schema:'public',table:'mysales_data',filter:'id=eq.'+cloudUser.id},payload=>{if(payload.new?.data&&!cloudBusy){db=payload.new.data;localStorage.setItem(KEY,JSON.stringify(db));render()}}).subscribe()}
async function cloudPush(){if(cloudBusy||!cloudUser||!ensureCloud())return;let {error}=await cloud.from('mysales_data').upsert({id:cloudUser.id,data:db,updated_at:new Date().toISOString()});if(error)console.warn('MySales cloud sync:',error.message)}
async function cloudSignOut(){if(!ensureCloud())return;await cloud.auth.signOut();cloudUser=null;alert('Đã đăng xuất khỏi Supabase. Dữ liệu trên thiết bị vẫn còn.');render()}
ensureCloud();if(cloud){cloud.auth.getSession().then(async({data})=>{if(data.session){cloudUser=data.session.user;startCloudRealtime();let r=await cloud.from('mysales_data').select('data').eq('id',cloudUser.id).maybeSingle();if(r.data?.data){db=r.data.data;localStorage.setItem(KEY,JSON.stringify(db));render()}}})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('quickAdd').onclick=()=>openOrder();document.getElementById('page').addEventListener('input',e=>{if(e.target.id==='orderSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('#orderRows tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.search?.includes(q)))}if(e.target.id==='customerSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('#customerRows tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.search?.includes(q)))}});render();
</script></body></html>
