<!doctype html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Kiếm được 10 tỷ sẽ nghỉ làm 😎 – Quản lý bán hàng</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#17243a;--muted:#7c899d;--line:#e8edf5;--green:#18a875;--green2:#e8f8f1;--red:#d94d5c;--amber:#b97819;--blue:#3478ee;--shadow:0 5px 22px rgba(34,67,115,.055)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:650}
button.secondary{background:#eef3fa;color:#52627a}
button.danger{background:#fff0f0;color:var(--red)}
button.small{padding:6px 9px;font-size:12px}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:#fff;color:#26354b;border-right:1px solid #e9eef6;padding:25px 16px;box-shadow:4px 0 20px rgba(35,60,100,.025)}
.brand{display:flex;align-items:center;gap:9px;color:#17243a;font-size:22px;font-weight:900;margin:0 12px 4px}
.brand-emoji{display:inline-flex;align-items:center;justify-content:center;flex:0 0 38px;width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#ffe28a,#ffb52e);font-size:23px;box-shadow:0 5px 12px #e6a52b35;transform:rotate(-5deg)}
.subbrand{color:#9aa6b7;font-size:10px;letter-spacing:1px;margin:0 12px 34px;font-weight:700}
.nav{display:grid;gap:7px}
.nav button{background:transparent;color:#68778d;text-align:left;font-weight:600;border-radius:10px;padding:11px 13px}
.nav button.active,.nav button:hover{background:#edf4ff;color:#3478ee}
.side-note{font-size:11px;color:#9aa6b7;margin:30px 12px}

.main{max-width:1600px;width:100%;margin:auto;padding:22px 30px 34px}
.app-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e7ecf4;border-radius:11px;padding:0 14px;width:min(440px,60%);height:42px;color:#9aa6b7}
.searchbox input{border:0;outline:0;width:100%;background:transparent;color:var(--ink)}
.profile-chip{display:flex;align-items:center;gap:10px}
.profile-chip strong,.profile-chip small{display:block}
.profile-chip small{font-size:11px;color:var(--muted)}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:#e7f0ff;color:#3478ee;display:grid;place-items:center;font-weight:800}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-size:25px;margin:0}
.top>button{background:#3478ee;border-radius:9px;box-shadow:0 5px 12px #3478ee25}
.muted{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:17px}
.card,.panel{background:var(--card);border:1px solid #e9eef6;border-radius:15px;padding:19px;box-shadow:var(--shadow)}
.metric-label{font-size:13px;font-weight:600;color:#75839a}
.metric{font-size:25px;font-weight:800;margin:12px 0 3px;letter-spacing:-.6px}
.metric-note{font-size:11px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}
.panel h2{font-size:15px;font-weight:750;margin:0 0 14px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{max-width:230px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:650;color:#526071}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px 11px;border:1px solid #dce2ea;border-radius:9px;background:white;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#78a8f7;box-shadow:0 0 0 3px #3478ee18}

.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}
th{color:var(--muted);font-weight:650;background:#f8faff}
td strong{font-size:13px}
.positive{color:var(--green);font-weight:750}
.negative{color:var(--red);font-weight:700}
.tag{display:inline-block;border-radius:30px;padding:4px 8px;background:var(--green2);color:var(--green);font-size:11px}
.empty{text-align:center;color:var(--muted);padding:30px}
.hidden{display:none!important}

.modal{position:fixed;inset:0;background:#172b4888;display:grid;place-items:center;padding:15px;z-index:5}
.dialog{background:white;border-radius:16px;padding:20px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}
.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.dialoghead h2{margin:0;font-size:19px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.span2{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.lineitem{display:grid;grid-template-columns:2fr .7fr 1fr 36px;gap:7px;align-items:end;margin-bottom:8px}
.lineitem input,.lineitem select{min-width:0;width:100%;padding:9px;border:1px solid #dce2ea;border-radius:8px}
.summaryline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}

.customer-picker{position:relative}
.customer-picker-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:44px;padding:11px 12px}
.customer-picker-list{position:absolute;z-index:20;top:calc(100% + 5px);left:0;right:0;max-height:min(52vh,390px);overflow:auto;background:#fff;border:1px solid #dfe6f0;border-radius:12px;box-shadow:0 12px 32px rgba(24,42,72,.18)}
.customer-option{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:11px 13px;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);text-align:left}
.customer-option:last-child{border-bottom:0}

/* Tối ưu hóa giao diện di động & Ép thẻ số liệu thành 2 cột x 2 hàng */
@media screen and (max-width: 850px) {
  html, body { width: 100% !important; margin: 0 !important; overflow-x: hidden !important; }
  .app { display: flex !important; flex-direction: column !important; width: 100vw !important; }
  .side { width: 100% !important; padding: 12px 14px !important; position: sticky; top: 0; z-index: 3; }
  .brand { font-size: 19px !important; margin: 0 0 8px !important; }
  .subbrand, .side-note { display: none !important; }
  .nav { display: flex !important; overflow-x: auto !important; gap: 6px !important; white-space: nowrap !important; }
  .nav button { font-size: 14px !important; min-height: 44px !important; padding: 10px 12px !important; flex: 0 0 auto !important; }
  
  .main { width: 100% !important; padding: 14px 12px 28px !important; }
  .app-topbar { flex-wrap: wrap !important; gap: 10px !important; }
  .searchbox { width: 100% !important; }
  .profile-chip small { display: none !important; }

  /* Ép khung chứa thẻ thống kê (Tổng quan và Báo cáo) thành 2 cột x 2 hàng */
  .app .main .cards,
  #page .cards {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
    width: 100% !important;
  }
  .card, .panel { padding: 14px !important; min-width: 0 !important; }
  .metric { font-size: 20px !important; word-break: break-word !important; }
  
  .grid2, .dashboard-grid, .lower-grid { grid-template-columns: 1fr !important; }

  /* Popup tối ưu cho di động */
  .modal { padding: 0 !important; place-items: end center !important; background: #10231fa8 !important; }
  .dialog {
    width: 100% !important; max-width: 100% !important;
    height: 92dvh !important; max-height: 92dvh !important;
    padding: 0 !important; border-radius: 20px 20px 0 0 !important;
    display: flex !important; flex-direction: column !important; overflow: hidden !important;
  }
  .dialoghead { flex: 0 0 auto; margin: 0 !important; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  #modalBody { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 0; }
  .formgrid { grid-template-columns: 1fr !important; }
  .span2 { grid-column: auto !important; }
  input, select, textarea { font-size: 16px !important; min-height: 44px !important; }
}
</style>
</head>
<body><div class="app">
<aside class="side"><div class="brand"><span class="brand-emoji">🤑</span><span>Kiếm được 10 tỷ<br> sẽ nghỉ làm</span></div><div class="subbrand">Làm hết mình, nghỉ hưu thật sớm 😎</div><nav class="nav">
<button class="active" data-page="dashboard">▦ Tổng quan</button><button data-page="orders">▤ Đơn hàng</button><button data-page="customers">♙ Khách hàng</button><button data-page="products">▣ Sản phẩm</button><button data-page="expenses">＋ Chi phí</button><button data-page="reports">▥ Báo cáo</button><button data-page="settings">⚙ Dữ liệu</button>
</nav><div class="side-note">💸 Mục tiêu: 10 tỷ rồi tính tiếp!</div></aside>
<main class="main"><header class="app-topbar"><div class="searchbox">⌕ <input id="globalSearch" placeholder="Tìm kiếm đơn hàng, khách hàng, sản phẩm..."></div><div class="profile-chip"><span class="profile-avatar">M</span><span><strong>Team nghỉ hưu sớm 😎</strong><small>Quản lý bán hàng</small></span></div></header><div class="top"><div><div class="muted" id="today"></div><h1 id="pageTitle">Tổng quan</h1></div><button id="quickAdd">＋ Tạo đơn hàng</button></div><div id="page"></div></main></div>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="secondary small" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
